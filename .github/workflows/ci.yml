name: ci
on:
  push:
  pull_request:

# Read-only token for every job: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The README names Node 22 (22.13 or later) and Node 24 as the two lines CI covers; a judge is likely to have one of them.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The whole loop (four scenarios, owner decisions, refunds) against a fake PayPal: no secret, no network.
      - run: npm run e2e:offline

  # Enforced secret scan over the full history. The local pre-commit hook is best-effort; this is not.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use the CLI directly: the action's push range asks for the root commit's
      # nonexistent parent on a first push, and otherwise scans only the push.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tool_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${tool_dir}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "${tool_dir}/${archive}" | sha256sum --check --strict
          tar -xzf "${tool_dir}/${archive}" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan full Git history
        run: gitleaks git --log-opts=--all --redact --no-banner --config .gitleaks.toml
